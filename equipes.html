<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipes – Copa Volvo de Vôlei 2026</title>
  <script src="inicio.js?v=4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body class="claro">
  <header class="fundo-volei">
    <div class="topo">
      <div class="mini-bola" data-bola></div>
      <h1>Copa Volvo de Vôlei</h1>
    </div>
    <div class="sub">Masculino 2026</div>
    <a href="index.html">← Voltar ao início</a>
  </header>

  <main>
    <h2>Escolha uma equipe</h2>
    <div class="equipes" id="lista-equipes"></div>
  </main>

  <footer>Copa Volvo de Vôlei Masculino 2026</footer>

  <script src="bola.js?v=4"></script>
  <script src="equipes.js?v=4"></script>
  <script>
    // Silhueta de um jogador saltando para atacar a bola
    const JOGADOR_SVG = `
      <svg class="jogador" viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
          <path d="M58 36 L62 64" stroke-width="12"/>
          <path d="M57 37 L42 24" stroke-width="6"/>
          <path d="M62 64 L50 79 L58 96" stroke-width="7"/>
          <path d="M61 64 L72 78 L68 94" stroke-width="7"/>
          <g class="braco"><path d="M61 34 L61 8" stroke-width="6"/></g>
        </g>
        <circle cx="56" cy="22" r="8" fill="#fff"/>
        <g class="bola-mini">
          <circle cx="82" cy="10" r="7" fill="#f1c21b" stroke="#1d4fa0" stroke-width="2.5"/>
          <path d="M76 8 Q82 14 88 8" fill="none" stroke="#1d4fa0" stroke-width="2"/>
        </g>
      </svg>`;

    const lista = document.getElementById("lista-equipes");
    EQUIPES.forEach(equipe => {
      const card = document.createElement("a");
      card.className = "card-equipe";
      card.href = "equipe.html?equipe=" + encodeURIComponent(equipe.pasta);
      card.innerHTML = JOGADOR_SVG + '<span class="nome"></span>';
      card.querySelector(".nome").textContent = equipe.nome;

      // Ao clicar: o jogador ataca a bola e depois abre a página da equipe
      card.addEventListener("click", e => {
        if (e.ctrlKey || e.metaKey || e.shiftKey) return;   // abrir em nova aba continua normal
        e.preventDefault();
        if (card.classList.contains("atacando")) return;
        card.classList.add("atacando");
        setTimeout(() => { location.href = card.href; }, 650);
      });
      lista.appendChild(card);
    });

    // Ao voltar para esta página pelo botão "voltar", desfaz a animação
    window.addEventListener("pageshow", () => {
      document.querySelectorAll(".card-equipe.atacando").forEach(c => c.classList.remove("atacando"));
    });
  </script>
</body>
</html>
