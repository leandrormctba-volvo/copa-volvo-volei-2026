<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipes – Copa Volvo de Vôlei 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🏐 Copa Volvo de Vôlei Masculino 2026</h1>
    <a href="index.html">← Voltar ao início</a>
  </header>

  <main>
    <h2>Escolha uma equipe</h2>
    <div class="equipes" id="lista-equipes"></div>
  </main>

  <footer>Copa Volvo de Vôlei Masculino 2026</footer>

  <script src="equipes.js"></script>
  <script>
    const lista = document.getElementById("lista-equipes");
    EQUIPES.forEach(nome => {
      const botao = document.createElement("a");
      botao.href = "equipe.html?nome=" + encodeURIComponent(nome);
      botao.textContent = nome;
      lista.appendChild(botao);
    });
  </script>
</body>
</html>
