<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipes – Copa Volvo de Vôlei 2026</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header class="fundo-volei">
    <div class="topo">
      <div class="mini-bola" data-bola></div>
      <h1>Copa Volvo de Vôlei</h1>
    </div>
    <div class="sub">Masculino 2026</div>
    <a href="index.html">← Voltar ao início</a>
  </header>

  <main>
    <h2>Escolha uma equipe</h2>
    <div class="equipes" id="lista-equipes"></div>
  </main>

  <footer>Copa Volvo de Vôlei Masculino 2026</footer>

  <script src="bola.js?v=3"></script>
  <script src="equipes.js?v=3"></script>
  <script>
    const lista = document.getElementById("lista-equipes");
    EQUIPES.forEach(equipe => {
      const botao = document.createElement("a");
      botao.href = "equipe.html?equipe=" + encodeURIComponent(equipe.pasta);
      botao.textContent = equipe.nome;
      lista.appendChild(botao);
    });
  </script>
</body>
</html>
