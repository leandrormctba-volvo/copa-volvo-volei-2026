<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipes – Copa Volvo de Vôlei 2026</title>
  <script src="inicio.js?v=7"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body class="claro">
  <header class="fundo-volei">
    <div class="topo">
      <div class="mini-bola" data-bola></div>
      <h1>Copa Volvo de Vôlei</h1>
    </div>
    <div class="sub">Masculino 2026</div>
    <a href="index.html">← Voltar ao início</a>
  </header>

  <main>
    <h2>Escolha uma equipe</h2>
    <div class="equipes" id="lista-equipes"></div>
  </main>

  <footer>Copa Volvo de Vôlei Masculino 2026</footer>

  <script src="bola.js?v=7"></script>
  <script src="equipes.js?v=7"></script>
  <script>
    // Silhueta de um jogador saltando para atacar a bola
    const JOGADOR_SVG = `
      <svg class="jogador" viewBox="0 0 120 108" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="#fff" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
          <!-- tronco arqueado para trás -->
          <path d="M46 34 Q40 52 49 70 L63 70 Q60 51 61 34 Z" stroke-width="3"/>
          <!-- braço de apoio apontando para a bola -->
          <path d="M51 38 L66 29 L80 22" fill="none" stroke-width="7"/>
          <!-- pernas dobradas (salto) -->
          <path d="M60 68 L69 86 L57 101" fill="none" stroke-width="9"/>
          <path d="M53 68 L51 88 L37 97" fill="none" stroke-width="9"/>
          <!-- braço de ataque (gira na cortada) -->
          <g class="braco"><path d="M58 36 L65 18 L58 5" fill="none" stroke-width="8"/></g>
        </g>
        <circle cx="51" cy="23" r="9" fill="#fff"/>
        <g class="bola-mini">
          <circle cx="88" cy="12" r="8" fill="#f6fafb" stroke="#78e4f5" stroke-width="2.5"/>
          <path d="M81 9 Q88 17 95 9 M88 4 Q84 12 88 20" fill="none" stroke="#78e4f5" stroke-width="2"/>
        </g>
      </svg>`;

    const lista = document.getElementById("lista-equipes");
    EQUIPES.forEach(equipe => {
      const card = document.createElement("a");
      card.className = "card-equipe";
      card.href = "equipe.html?equipe=" + encodeURIComponent(equipe.pasta);
      card.innerHTML = JOGADOR_SVG + '<span class="nome"></span>';
      card.querySelector(".nome").textContent = equipe.nome;

      // Ao clicar: o jogador ataca a bola e depois abre a página da equipe
      card.addEventListener("click", e => {
        if (e.ctrlKey || e.metaKey || e.shiftKey) return;   // abrir em nova aba continua normal
        e.preventDefault();
        if (card.classList.contains("atacando")) return;
        card.classList.add("atacando");
        setTimeout(() => { location.href = card.href; }, 650);
      });
      lista.appendChild(card);
    });

    // Ao voltar para esta página pelo botão "voltar", desfaz a animação
    window.addEventListener("pageshow", () => {
      document.querySelectorAll(".card-equipe.atacando").forEach(c => c.classList.remove("atacando"));
    });
  </script>
</body>
</html>
