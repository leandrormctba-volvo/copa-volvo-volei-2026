<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fotos da equipe – Copa Volvo de Vôlei 2026</title>
  <script src="inicio.js?v=9"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body class="claro">
  <header class="fundo-volei">
    <div class="topo">
      <div class="mini-bola" data-bola></div>
      <h1 id="titulo">Equipe</h1>
    </div>
    <div class="sub">Copa Volvo de Vôlei Masculino 2026</div>
    <a href="equipes.html" id="voltar">← Voltar para as equipes</a>
  </header>

  <main>
    <div id="jogos"></div>
    <div class="aviso" id="aviso" hidden></div>
  </main>

  <!-- Foto ampliada -->
  <div class="ampliada" id="ampliada" hidden>
    <button class="fechar" id="fechar" aria-label="Fechar">✕</button>
    <button class="seta esq" id="anterior" aria-label="Foto anterior">‹</button>
    <img id="foto-grande" alt="">
    <button class="seta dir" id="proxima" aria-label="Próxima foto">›</button>
    <a class="baixar baixar-grande" id="baixar-grande" href="#" target="_blank" rel="noopener">⬇ Baixar foto</a>
  </div>

  <footer>Copa Volvo de Vôlei Masculino 2026</footer>

  <script src="bola.js?v=9"></script>
  <script src="equipes.js?v=9"></script>
  <script src="fotos.js?v=9"></script>
  <script>
    // Endereço de imagens do Google que aguenta muitas fotos de uma vez
    // (o "drive.google.com/thumbnail" bloqueia depois das primeiras fotos)
    const celular   = matchMedia("(max-width: 600px)").matches;
    const miniatura = id => "https://lh3.googleusercontent.com/d/" + id + "=w" + (celular ? 320 : 480);
    const grande    = id => "https://lh3.googleusercontent.com/d/" + id + "=w" + (celular ? 1200 : 2000);
    const reserva   = id => "https://drive.google.com/thumbnail?id=" + id + "&sz=w400";
    const download  = id => "https://drive.google.com/uc?export=download&id=" + id;

    const params = new URLSearchParams(location.search);
    const pasta = params.get("equipe");
    const equipe = EQUIPES.find(e => e.pasta === pasta);
    const aviso = document.getElementById("aviso");
    const areaJogos = document.getElementById("jogos");
    const voltar = document.getElementById("voltar");

    let todas = [];   // fotos do jogo aberto, para navegar na foto ampliada
    let atual = 0;

    // Se a foto falhar, tenta de novo (até 3 vezes) e depois usa o endereço reserva
    function carregarFoto(img, id) {
      let tentativas = 0;
      img.onerror = () => {
        tentativas++;
        if (tentativas <= 3) setTimeout(() => { img.src = miniatura(id) + "?t=" + tentativas; }, 800 * tentativas);
        else if (tentativas === 4) img.src = reserva(id);
      };
      img.src = miniatura(id);
    }

    function nomeDoJogo(jogo) {
      // Nomes oficiais das duas equipes (ex.: "GS x AVALANCHE")
      const times = EQUIPES.filter(e => jogoDaEquipe(jogo.nome, e)).map(e => e.nome);
      return times.length === 2 ? times.join(" x ") : jogo.nome.replace(/^jogo \d+\s*/i, "");
    }

    if (!equipe) {
      document.getElementById("titulo").textContent = "Equipe não encontrada";
      aviso.textContent = "Volte e escolha uma equipe.";
      aviso.hidden = false;
    } else {
      document.getElementById("titulo").textContent = equipe.nome;
      document.title = equipe.nome + " – Copa Volvo de Vôlei 2026";

      const jogos = JOGOS.map((j, n) => ({ ...j, n }))
                         .filter(j => jogoDaEquipe(j.nome, equipe) && j.fotos.length);
      const escolhido = jogos.find(j => String(j.n) === params.get("jogo"));

      if (jogos.length === 0) {
        aviso.textContent = "📷 As fotos desta equipe serão publicadas em breve.";
        aviso.hidden = false;
      } else if (!escolhido) {
        // ETAPA 1: lista dos jogos da equipe
        const titulo = document.createElement("h2");
        titulo.textContent = "Escolha um jogo";
        const lista = document.createElement("div");
        lista.className = "lista-jogos";
        jogos.forEach(jogo => {
          const card = document.createElement("a");
          card.className = "card-jogo";
          card.href = "equipe.html?equipe=" + encodeURIComponent(equipe.pasta) + "&jogo=" + jogo.n;
          const capa = document.createElement("img");
          capa.alt = "";
          carregarFoto(capa, jogo.fotos[0]);
          const texto = document.createElement("span");
          texto.className = "card-jogo-texto";
          texto.innerHTML = "<strong></strong><small></small>";
          texto.querySelector("strong").textContent = nomeDoJogo(jogo);
          texto.querySelector("small").textContent = jogo.fotos.length + " fotos  ›";
          card.append(capa, texto);
          lista.appendChild(card);
        });
        areaJogos.append(titulo, lista);
      } else {
        // ETAPA 2: fotos do jogo escolhido
        voltar.href = "equipe.html?equipe=" + encodeURIComponent(equipe.pasta);
        voltar.textContent = "← Voltar para os jogos da " + equipe.nome;
        document.title = nomeDoJogo(escolhido) + " – Copa Volvo de Vôlei 2026";

        const secao = document.createElement("section");
        secao.className = "jogo";
        const titulo = document.createElement("h2");
        titulo.textContent = nomeDoJogo(escolhido) + " ";
        const qtd = document.createElement("small");
        qtd.textContent = "· " + escolhido.fotos.length + " fotos";
        titulo.appendChild(qtd);
        secao.appendChild(titulo);

        const galeria = document.createElement("div");
        galeria.className = "galeria";
        escolhido.fotos.forEach((id, indice) => {
          todas.push(id);
          const card = document.createElement("div");
          card.className = "foto";

          const img = document.createElement("img");
          img.loading = "lazy";
          img.alt = nomeDoJogo(escolhido) + " – foto " + (indice + 1);
          img.onclick = () => abrir(indice);
          carregarFoto(img, id);

          const botao = document.createElement("a");
          botao.className = "baixar";
          botao.href = download(id);
          botao.target = "_blank";
          botao.rel = "noopener";
          botao.textContent = "⬇ Baixar";

          card.append(img, botao);
          galeria.appendChild(card);
        });
        secao.appendChild(galeria);
        areaJogos.appendChild(secao);
      }
    }

    const ampliada = document.getElementById("ampliada");
    const fotoGrande = document.getElementById("foto-grande");
    const baixarGrande = document.getElementById("baixar-grande");

    function abrir(i) {
      atual = (i + todas.length) % todas.length;
      fotoGrande.src = grande(todas[atual]);
      baixarGrande.href = download(todas[atual]);
      ampliada.hidden = false;
    }
    function fechar() { ampliada.hidden = true; fotoGrande.src = ""; }

    document.getElementById("fechar").onclick = fechar;
    document.getElementById("anterior").onclick = e => { e.stopPropagation(); abrir(atual - 1); };
    document.getElementById("proxima").onclick = e => { e.stopPropagation(); abrir(atual + 1); };
    ampliada.onclick = e => { if (e.target === ampliada) fechar(); };
    document.addEventListener("keydown", e => {
      if (ampliada.hidden) return;
      if (e.key === "Escape") fechar();
      if (e.key === "ArrowLeft") abrir(atual - 1);
      if (e.key === "ArrowRight") abrir(atual + 1);
    });

    // No celular: arrastar o dedo para o lado troca de foto na foto ampliada
    let inicioX = null;
    ampliada.addEventListener("touchstart", e => { inicioX = e.touches[0].clientX; }, { passive: true });
    ampliada.addEventListener("touchend", e => {
      if (inicioX === null) return;
      const dx = e.changedTouches[0].clientX - inicioX;
      inicioX = null;
      if (Math.abs(dx) > 50) abrir(atual + (dx < 0 ? 1 : -1));
    });
  </script>
</body>
</html>
